<!DOCTYPE html>
<html lang="es" data-theme="night">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>English Adventure: The World of Hobbies</title>
<meta name="description" content="Videojuego educativo para aprender inglés: hobbies y Present Continuous.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Great+Vibes&display=swap" rel="stylesheet">
<style>
:root{--font:"Fredoka","Baloo 2","Nunito","Segoe UI Rounded","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
--bg1:#070b2a;--bg2:#1a0f52;--bg3:#0a2a70;--r1:#3a1d8a;--r2:#0d4fd6;--r3:#0aa5c9;
--card:rgba(20,26,76,.8);--card2:rgba(255,255,255,.07);--line:rgba(120,190,255,.38);--txt:#eef3ff;--mut:#aab8ee;
--cy:#38d6ff;--vi:#9b6bff;--el:#3d7bff;--gold:#ffcf40;--ok:#35e08a;--bad:#ff5d7a;--pink:#ff7ad9;--ac:#38d6ff;--glow:rgba(56,214,255,.22)}
[data-theme=day]{--bg1:#bfe6ff;--bg2:#e6dcff;--bg3:#a9d6ff;--r1:#ffe9a8;--r2:#9fd0ff;--r3:#c8b6ff;
--card:rgba(255,255,255,.9);--card2:rgba(40,60,160,.07);--line:rgba(70,110,230,.4);--txt:#1a2158;--mut:#4a5796;--glow:rgba(61,123,255,.2)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;min-height:100%}
body{font-family:var(--font);color:var(--txt);line-height:1.35;padding:0 0 58px;overflow-x:hidden;
background:radial-gradient(1100px 700px at 12% -10%,var(--r1) 0%,transparent 60%),radial-gradient(900px 600px at 100% 8%,var(--r2) 0%,transparent 55%),radial-gradient(900px 700px at 50% 112%,var(--r3) 0%,transparent 55%),linear-gradient(160deg,var(--bg1),var(--bg2) 55%,var(--bg3));background-attachment:fixed}
canvas.fxc{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
#sky{z-index:0}#fx{z-index:95}
#view,#hud{position:relative;z-index:2}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
input{font:inherit}
h1,h2,h3,h4,p{margin:0}
.row{display:flex;gap:12px;align-items:center;justify-content:center}
.wrapc{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.45em;padding:.72em 1.35em;border-radius:18px;font-weight:700;letter-spacing:.03em;color:#fff;background:linear-gradient(180deg,#5aa7ff,#3d5bff 60%,#6a3dff);box-shadow:0 6px 0 #232a9c,0 10px 24px rgba(61,123,255,.45),inset 0 2px 0 rgba(255,255,255,.35);transition:transform .12s,box-shadow .12s,filter .12s;text-shadow:0 1px 0 rgba(0,0,0,.25)}
.btn:hover{transform:translateY(-2px) scale(1.03);filter:brightness(1.12)}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #232a9c,inset 0 2px 0 rgba(255,255,255,.35)}
.btn.big{font-size:1.3rem;padding:.8em 1.7em;border-radius:24px;background:linear-gradient(180deg,#ffe46b,#ffb02e 55%,#ff7a3d);box-shadow:0 7px 0 #b9520c,0 12px 30px rgba(255,176,46,.5),inset 0 2px 0 rgba(255,255,255,.55);color:#3b1c00;text-shadow:none;animation:pulse 2.2s infinite}
.btn.alt{background:linear-gradient(180deg,#c39bff,#7c4dff 60%,#5b2be0);box-shadow:0 6px 0 #37179a,0 10px 24px rgba(124,77,255,.45),inset 0 2px 0 rgba(255,255,255,.35)}
.btn.ghost{background:var(--card2);box-shadow:inset 0 0 0 2px var(--line);color:var(--txt);text-shadow:none}
.btn.sm{font-size:.92rem;padding:.55em 1em;border-radius:14px}
.btn:disabled{opacity:.5;pointer-events:none;animation:none}
.ib{width:42px;height:42px;border-radius:14px;background:var(--card2);box-shadow:inset 0 0 0 2px var(--line);font-size:1.15rem;transition:transform .12s}
.ib:hover{transform:scale(1.12) rotate(-4deg)}.ib.off{opacity:.45}
.link{color:var(--mut);text-decoration:underline;font-size:.85rem;margin-top:6px}
.chip{display:inline-flex;align-items:center;gap:.3em;padding:.3em .75em;border-radius:99px;background:var(--card2);box-shadow:inset 0 0 0 1.5px var(--line);font-weight:600;font-size:.92rem;white-space:nowrap}
.card{background:var(--card);border:2px solid var(--line);border-radius:26px;padding:22px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.06),0 0 30px var(--glow),0 18px 50px rgba(0,0,20,.4);backdrop-filter:blur(8px)}
.title{font-weight:700;font-size:clamp(1.6rem,4.6vw,2.6rem);background:linear-gradient(90deg,var(--cy),#fff,var(--gold),var(--pink),var(--cy));background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:slide 6s linear infinite;filter:drop-shadow(0 0 12px rgba(56,214,255,.35));text-align:center}
[data-theme=day] .title{background-image:linear-gradient(90deg,#2a4fff,#8a2be2,#e06a00,#d6249f,#2a4fff)}
.title.sm{font-size:clamp(1.3rem,3.6vw,1.9rem)}
/* HUD */
#hud{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:8px 14px;background:var(--card);border-bottom:2px solid var(--line);position:sticky;top:0;z-index:40;backdrop-filter:blur(10px)}
.hud-me{display:flex;align-items:center;gap:8px;font-weight:700;max-width:40vw}.hud-me b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hud-st,.hud-bt{display:flex;gap:6px;align-items:center}
/* mascot */
.mascot{position:relative;display:inline-block;width:120px;line-height:0}
.mascot svg{width:100%;height:auto;overflow:visible;filter:drop-shadow(0 6px 14px rgba(0,0,30,.45))}
.mascot.big{width:170px}.mascot.tiny{width:36px}.mascot.mini{width:54px}
.mascot .mb{animation:bob 2.4s ease-in-out infinite;transform-origin:50% 100%;transform-box:fill-box}
.mascot .meye{animation:blink 4s infinite;transform-origin:50% 50%;transform-box:fill-box}
.mascot.wave .marm{animation:wav .8s ease-in-out infinite;transform-origin:0% 100%;transform-box:fill-box}
.mascot.jump{animation:jump .7s ease-in-out infinite}
.mascot.sad .mb{animation:none}.mascot.sad{filter:saturate(.6)}
.m-acc{position:absolute;left:50%;top:-12%;transform:translateX(-50%);font-size:2.6em;line-height:1;font-style:normal;font-weight:400}
.mascot{font-size:16px}.mascot.big{font-size:23px}.mascot.tiny{font-size:5px}.mascot.mini{font-size:7.5px}
.m-acc.eye{top:31%;font-size:2.9em}
/* home */
.home{max-width:760px;margin:0 auto;padding:22px 14px;text-align:center}
.wtitle{font-size:clamp(1.9rem,7vw,3.6rem);font-weight:700;line-height:1.05;letter-spacing:.02em}
.wtitle .ww{display:inline-block;white-space:nowrap;margin:0 .14em}
.wtitle .ww span{display:inline-block;animation:letter 2.2s ease-in-out infinite;text-shadow:0 4px 0 rgba(0,0,40,.45),0 0 18px currentColor}
[data-theme=day] .wtitle .ww span{text-shadow:0 3px 0 rgba(255,255,255,.8);filter:saturate(1.6) brightness(.72)}
.sub{color:var(--mut);margin:8px 0 4px;font-size:1.05rem}
.hero{display:flex;align-items:flex-end;justify-content:center;gap:6px;margin:8px 0 -6px}
.bubble{background:#fff;color:#1b2255;font-weight:600;padding:10px 16px;border-radius:20px 20px 4px 20px;max-width:260px;box-shadow:0 8px 20px rgba(0,0,30,.35);margin-bottom:70px;animation:pop .5s both}
.hcard{display:flex;flex-direction:column;gap:14px;align-items:center;text-align:center}
.hcard label{font-weight:600;color:var(--mut)}
.hcard input,.typer input,.dsearch{width:min(100%,380px);padding:.7em 1em;border-radius:16px;border:2px solid var(--line);background:rgba(255,255,255,.95);color:#1b2255;font-weight:600;font-size:1.15rem;text-align:center;outline:none;transition:box-shadow .2s}
.hcard input:focus,.typer input:focus,.dsearch:focus{box-shadow:0 0 0 4px rgba(56,214,255,.45)}
.seg{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center}
.seg button:not(.spk){padding:.4em .9em;border-radius:12px;background:var(--card2);box-shadow:inset 0 0 0 2px var(--line);font-weight:600}
.seg button.on{background:linear-gradient(180deg,var(--cy),var(--el));color:#fff;box-shadow:none}
.saved{width:100%;max-width:420px;display:flex;flex-direction:column;gap:5px;align-items:center;color:var(--mut)}
.pbar{width:100%;height:12px;border-radius:99px;background:rgba(0,0,30,.35);overflow:hidden;box-shadow:inset 0 0 0 1.5px var(--line)}
.pbar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--ok),var(--cy),var(--vi));transition:width .6s}
.shake{animation:shake .4s}
/* speaker */
.spk{display:inline-flex;align-items:center;gap:.3em;padding:.3em .7em;border-radius:12px;background:linear-gradient(180deg,#4fe0ff,#2a8bff);color:#fff;font-weight:700;font-size:.9rem;box-shadow:0 3px 0 #1a56b8;transition:transform .12s;vertical-align:middle}
.spk:hover{transform:scale(1.1)}.spk:active{transform:translateY(3px);box-shadow:none}
.spk.big{font-size:1.1rem;padding:.55em 1.1em;border-radius:16px}
.spk.slow{background:linear-gradient(180deg,#7ee8a2,#1fae6a);box-shadow:0 3px 0 #127a48}
.spkrow{display:flex;gap:10px;justify-content:center;margin:10px 0}
/* map */
.mapv{max-width:1100px;margin:0 auto;padding:14px}
.maphead{display:flex;flex-direction:column;gap:10px;align-items:center;margin-bottom:12px}
.map{position:relative;width:100%;border-radius:28px;border:2px solid var(--line);overflow:hidden;background:linear-gradient(180deg,#0b1242 0%,#1b1764 45%,#143d6e 75%,#0f5a55 100%);box-shadow:0 0 34px var(--glow),inset 0 0 80px rgba(0,0,40,.6)}
[data-theme=day] .map{background:linear-gradient(180deg,#7cc8ff 0%,#b9e4ff 45%,#bff0c2 75%,#7ed68a 100%)}
.map>svg{position:absolute;inset:0;width:100%;height:100%}
.road{fill:none;stroke:rgba(0,0,30,.45);stroke-width:26;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.road2{fill:none;stroke:#ffe9a3;stroke-width:4;stroke-dasharray:4 14;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke;animation:dash 1.6s linear infinite}
.deco{position:absolute;font-size:clamp(1.2rem,3vw,2.2rem);opacity:.85;pointer-events:none;animation:float 5s ease-in-out infinite}
.node{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:1px;width:118px;z-index:2;transition:transform .15s}
.node:hover{transform:translate(-50%,-56%) scale(1.07)}
.nico{width:68px;height:68px;border-radius:50%;display:grid;place-items:center;font-size:2rem;background:radial-gradient(circle at 30% 25%,#fff8,transparent 45%),linear-gradient(160deg,var(--cy),var(--vi));box-shadow:0 6px 0 #2a2f9c,0 0 0 4px #fff3,0 0 22px rgba(56,214,255,.7)}
.node.done .nico{background:radial-gradient(circle at 30% 25%,#fff8,transparent 45%),linear-gradient(160deg,#7ee8a2,#1fae6a);box-shadow:0 6px 0 #127a48,0 0 0 4px #fff3,0 0 22px rgba(53,224,138,.7)}
.node.cur .nico{animation:pulse 1.5s infinite;background:radial-gradient(circle at 30% 25%,#fff8,transparent 45%),linear-gradient(160deg,#ffe46b,#ff7a3d);box-shadow:0 6px 0 #b9520c,0 0 0 4px #fff5,0 0 30px rgba(255,200,60,.9)}
.node.lock .nico{background:linear-gradient(160deg,#59608f,#2d3260);box-shadow:0 6px 0 #1a1d45;filter:grayscale(.4)}
.node.bossn .nico{width:84px;height:84px;font-size:2.5rem}
.nnum{position:absolute;top:-6px;left:22px;width:26px;height:26px;border-radius:50%;background:#fff;color:#2a2f9c;font-weight:700;font-size:.85rem;display:grid;place-items:center;box-shadow:0 2px 6px #0006}
.nname{font-weight:700;font-size:.78rem;line-height:1.1;background:rgba(5,8,40,.78);color:#fff;padding:3px 8px;border-radius:10px;margin-top:8px;text-align:center}
.nst{color:var(--gold);font-size:.9rem;letter-spacing:1px;text-shadow:0 1px 3px #000a}
.mapme{position:absolute;transform:translate(22px,-92%);z-index:3;pointer-events:none;transition:left .6s,top .6s}
/* intro/lesson */
.intro,.resv,.act,.game,.zone{max-width:860px;margin:0 auto;padding:14px}
.ihead{display:flex;gap:14px;align-items:center;margin-bottom:14px}
.iico{font-size:3.4rem;width:92px;height:92px;flex:none;display:grid;place-items:center;border-radius:26px;background:linear-gradient(160deg,var(--ac),var(--vi));box-shadow:0 0 26px var(--ac);animation:float 4s ease-in-out infinite}
.ihead small{color:var(--ac);font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.ihead h2{font-size:clamp(1.4rem,4vw,2rem)}.ihead p{color:var(--mut)}
.lesson{background:var(--card2);border-radius:20px;padding:16px;margin-bottom:16px;box-shadow:inset 0 0 0 1.5px var(--line)}
.lbody{min-height:190px;display:flex;flex-direction:column;gap:10px;align-items:center;text-align:center}
.lbody>*{animation:rise .5s both}.lbody>*:nth-child(2){animation-delay:.25s}.lbody>*:nth-child(3){animation-delay:.5s}.lbody>*:nth-child(4){animation-delay:.75s}.lbody>*:nth-child(5){animation-delay:1s}.lbody>*:nth-child(6){animation-delay:1.25s}
.lbody h3{font-size:1.25rem;color:var(--ac)}
.guide{display:flex;align-items:center;gap:10px;justify-content:center}.guide>span{font-size:2.6rem;animation:bob 2s ease-in-out infinite}.guide>p{background:#fff;color:#1b2255;padding:8px 14px;border-radius:16px 16px 16px 4px;font-weight:600;text-align:left}
.lnav{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:10px}
.dots{display:flex;gap:6px}.dots i{width:10px;height:10px;border-radius:50%;background:var(--line)}.dots i.on{background:var(--ac);box-shadow:0 0 8px var(--ac)}
.ex{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center;font-size:1.15rem;font-weight:600;background:rgba(0,0,30,.22);padding:6px 12px;border-radius:14px}
[data-theme=day] .ex{background:rgba(40,60,160,.08)}
.ex>span:first-child{font-size:1.6rem}
i.be,i.ng,i.vb,i.sj{font-style:normal;padding:0 .25em;border-radius:7px;color:#10143c;font-weight:700}
i.be{background:var(--gold)}i.ng{background:#ff8fa3}i.vb{background:#7ee8a2}i.sj{background:#8fd8ff}
.formula{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center;font-weight:700}
.formula b{padding:.35em .7em;border-radius:12px;color:#10143c}
.vchip{display:inline-flex;align-items:center;gap:.4em;padding:.4em .8em;border-radius:14px;background:var(--card2);box-shadow:inset 0 0 0 1.5px var(--line);font-weight:600}
.vchip:hover{box-shadow:inset 0 0 0 2px var(--cy)}
.setup{display:flex;flex-direction:column;gap:8px;align-items:center;margin-bottom:14px}
/* game */
.game{--tg:linear-gradient(90deg,#0d3b2e,#145a3a)}
.sc-forest{--ac:#35e08a;--tg:linear-gradient(90deg,#0b3d2c,#16663f)}
.sc-sound{--ac:#ff7ad9;--tg:linear-gradient(90deg,#3a1466,#1b2a8a)}
.sc-castle{--ac:#b388ff;--tg:linear-gradient(90deg,#2a1b5e,#55309a)}
.sc-lab{--ac:#38d6ff;--tg:linear-gradient(90deg,#06384a,#0b6a7e)}
.sc-academy{--ac:#ff6b6b;--tg:linear-gradient(90deg,#5a1030,#1b2a8a)}
.sc-park{--ac:#8be04e;--tg:linear-gradient(90deg,#1c5a2a,#2a7a8a)}
.sc-stadium{--ac:#ffcf40;--tg:linear-gradient(90deg,#14502a,#0d3b5e)}
.sc-tower{--ac:#7aa2ff;--tg:linear-gradient(90deg,#1a1f6e,#44309a)}
.sc-city{--ac:#ffa64d;--tg:linear-gradient(90deg,#2a2a6e,#6a2a5a)}
.sc-arena{--ac:#ff4d6d;--tg:linear-gradient(90deg,#4a0d2a,#2a0d5a)}
.gbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.gbar .gt{flex:1;font-size:1.05rem;min-width:120px}
.track{position:relative;height:78px;border-radius:20px;background:var(--tg);border:2px solid var(--ac);box-shadow:0 0 18px color-mix(in srgb,var(--ac) 45%,transparent);overflow:hidden;margin-bottom:10px}
.track .dec{position:absolute;inset:0;display:flex;justify-content:space-around;align-items:flex-end;font-size:1.7rem;opacity:.75;padding-bottom:20px}
.track .pth{position:absolute;left:3%;right:3%;bottom:12px;height:6px;border-radius:9px;background:repeating-linear-gradient(90deg,#fff8 0 10px,transparent 10px 20px)}
.track .fill{position:absolute;left:3%;bottom:12px;height:6px;border-radius:9px;background:var(--ac);box-shadow:0 0 10px var(--ac);transition:width .6s}
.runner{position:absolute;bottom:8px;left:3%;transform:translateX(-50%);transition:left .6s cubic-bezier(.3,1.6,.5,1)}
.track .goal{position:absolute;right:1.5%;bottom:12px;font-size:1.8rem}
.tbar{height:10px;border-radius:99px;background:rgba(0,0,30,.4);overflow:hidden;margin-bottom:10px}
.tbar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--bad),var(--gold),var(--ok));transform-origin:left;border-radius:99px}
.qcard{text-align:center;border-color:var(--ac);display:flex;flex-direction:column;gap:10px;align-items:center}
.pop{animation:pop .35s both}
.tag2{align-self:center;background:var(--gold);color:#3b1c00;font-weight:700;padding:.2em .8em;border-radius:99px;font-size:.85rem}
.art{font-size:clamp(4rem,15vw,6.2rem);line-height:1.1;filter:drop-shadow(0 8px 14px rgba(0,0,30,.45));animation:float 3.2s ease-in-out infinite;display:inline-block;white-space:nowrap;letter-spacing:-.06em}
.art.sm{font-size:clamp(2.6rem,9vw,3.6rem)}.art.xs{font-size:1.9rem;animation:none}
.svgart{width:1em;height:1em;vertical-align:-.12em}
.scene{display:flex;align-items:center;justify-content:center;gap:18px;padding:10px 22px;border-radius:22px;background:linear-gradient(180deg,rgba(255,255,255,.14),rgba(255,255,255,.04));box-shadow:inset 0 0 0 2px var(--line)}
.scene .who{display:flex;flex-direction:column;align-items:center;font-size:clamp(2.6rem,9vw,3.8rem);line-height:1.05;animation:bob 1.6s ease-in-out infinite}
.scene .who em{font-style:normal;font-size:.95rem;font-weight:700;background:var(--cy);color:#06223a;border-radius:99px;padding:.1em .8em;margin-top:4px}
.scene .art{font-size:clamp(3.2rem,11vw,4.8rem)}
.qtext{font-size:clamp(1.25rem,4.2vw,1.7rem);font-weight:700}
.qsub{color:var(--mut);font-weight:600}
.blank{display:inline-block;min-width:3.2em;border-bottom:4px dashed var(--gold);color:var(--gold)}
.srcsen{font-size:1.3rem;font-weight:700;background:rgba(0,0,30,.25);padding:.4em .9em;border-radius:14px}
[data-theme=day] .srcsen{background:rgba(40,60,160,.08)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;max-width:640px}
.opts.one{grid-template-columns:1fr}.opts.n3{grid-template-columns:repeat(3,1fr)}
.opt{padding:.85em .6em;border-radius:18px;font-weight:700;font-size:clamp(1rem,3.2vw,1.2rem);background:linear-gradient(180deg,rgba(255,255,255,.16),rgba(255,255,255,.05));box-shadow:inset 0 0 0 2px var(--line),0 5px 0 rgba(0,0,40,.4);transition:transform .12s,box-shadow .12s}
[data-theme=day] .opt{background:#fff;box-shadow:inset 0 0 0 2px var(--line),0 5px 0 rgba(60,80,180,.25)}
.opt:hover:not(:disabled){transform:translateY(-3px);box-shadow:inset 0 0 0 3px var(--cy),0 8px 0 rgba(0,0,40,.4),0 0 18px rgba(56,214,255,.5)}
.opts.up .opt{text-transform:uppercase;font-size:1.3rem}
.opt.ok,.pic.ok,.yn .ok{background:linear-gradient(180deg,#5cf0a6,#1fae6a)!important;color:#04321c;box-shadow:0 0 22px var(--ok)!important;animation:pop .35s}
.opt.bad,.pic.bad,.yn .bad{background:linear-gradient(180deg,#ff8fa3,#e03a5c)!important;color:#fff;animation:shake .4s}
.opt:disabled:not(.ok):not(.bad){opacity:.5}
.pics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;width:100%;max-width:640px}
.pic{aspect-ratio:1;border-radius:22px;background:linear-gradient(180deg,rgba(255,255,255,.18),rgba(255,255,255,.05));box-shadow:inset 0 0 0 2px var(--line),0 5px 0 rgba(0,0,40,.4);display:grid;place-items:center;transition:transform .12s}
.pic:hover:not(:disabled){transform:translateY(-4px) scale(1.04);box-shadow:inset 0 0 0 3px var(--cy),0 0 20px rgba(56,214,255,.5)}
.pic.bad{opacity:.55}
.hintline{min-height:1.4em;color:var(--gold);font-weight:600}[data-theme=day] .hintline{color:#b85c00}
.yn{display:flex;gap:16px;justify-content:center;flex-wrap:wrap}
.yn .btn{font-size:1.4rem;min-width:140px}
.yn .yes{background:linear-gradient(180deg,#7ee8a2,#1fae6a);box-shadow:0 6px 0 #127a48}
.yn .no{background:linear-gradient(180deg,#ff9aa9,#e03a5c);box-shadow:0 6px 0 #9c1f3b}
.typer{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;width:100%}
.typer input.ok{background:#c9ffe0}.typer input.bad{background:#ffd3db}
/* tiles */
.tb{width:100%;display:flex;flex-direction:column;gap:12px;align-items:center}
.ans,.pool{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;min-height:58px;width:100%;padding:8px;border-radius:18px}
.ans{background:rgba(0,0,30,.3);box-shadow:inset 0 0 0 2px dashed var(--line);border:2px dashed var(--ac)}
[data-theme=day] .ans{background:rgba(40,60,160,.08)}
.ans.ok{border-color:var(--ok);box-shadow:0 0 20px var(--ok)}.ans.bad{border-color:var(--bad);animation:shake .4s}
.tile{touch-action:none;user-select:none;-webkit-user-select:none;padding:.5em .8em;border-radius:14px;font-weight:700;font-size:1.15rem;color:#10143c;background:linear-gradient(180deg,#fff,#cfe6ff);box-shadow:0 4px 0 #6a8fd6,0 6px 12px rgba(0,0,40,.3);transition:transform .1s;cursor:grab}
.tile:hover{transform:translateY(-2px)}
.tile.on{background:linear-gradient(180deg,#fff3b8,#ffcf40);box-shadow:0 4px 0 #c28a00}
.letters .tile{min-width:44px;height:48px;padding:0;font-size:1.35rem}
.slot{display:inline-block;border-radius:12px;border:2px dashed var(--line);opacity:.7}
.letters .slot{width:44px;height:48px}.words .slot{width:64px;height:44px}
.gap{display:inline-block;width:16px}
.tile.ghost{position:fixed;z-index:99;pointer-events:none;transform:translate(-50%,-50%) scale(1.15) rotate(-4deg);opacity:.95;box-shadow:0 14px 30px rgba(0,0,40,.5)}
/* feedback */
.fb{min-height:74px;margin-top:10px;scroll-margin-bottom:70px}
.fbox{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:12px 16px;border-radius:20px;animation:rise .3s both;font-weight:600}
.fbox.good{background:linear-gradient(180deg,rgba(53,224,138,.3),rgba(53,224,138,.14));box-shadow:inset 0 0 0 2px var(--ok)}
.fbox.oops{background:linear-gradient(180deg,rgba(255,93,122,.3),rgba(255,93,122,.14));box-shadow:inset 0 0 0 2px var(--bad)}
.fbox>div{flex:1;min-width:200px}.fbox b{font-size:1.15rem}.fbox p{margin-top:4px}
.fpts{position:fixed;left:50%;top:28%;font-size:2rem;font-weight:700;color:var(--gold);text-shadow:0 2px 0 #0008,0 0 14px var(--gold);pointer-events:none;z-index:96;animation:fly 1s forwards}
/* boss */
.arena{display:flex;align-items:flex-end;justify-content:space-around;gap:8px;padding:10px;border-radius:22px;background:var(--tg);border:2px solid var(--ac);margin-bottom:10px;box-shadow:0 0 22px rgba(255,77,109,.4)}
.arena .side{display:flex;flex-direction:column;align-items:center;gap:4px;flex:1}
.arena .vs{font-weight:700;font-size:1.6rem;color:var(--gold);text-shadow:0 0 12px var(--gold);align-self:center;animation:pulse 1.4s infinite}
.hp{width:min(100%,220px);height:16px;border-radius:99px;background:rgba(0,0,30,.5);overflow:hidden;box-shadow:inset 0 0 0 2px #fff4}
.hp i{display:block;height:100%;background:linear-gradient(90deg,#ff4d6d,#ffcf40);border-radius:99px;transition:width .5s}
.boss{width:150px;line-height:0;animation:bob 2s ease-in-out infinite}.boss svg{width:100%;overflow:visible;filter:drop-shadow(0 8px 16px rgba(0,0,30,.5))}
.boss .bsh{opacity:0;transition:opacity .25s}.boss.def .bsh{opacity:1}
.boss .bx{display:none}
.boss.atk{animation:batk .6s}.boss.hit{animation:bhit .5s}
.boss.ko{animation:bko 1.4s forwards}.boss.ko .beye{display:none}.boss.ko .bx{display:block}
.hearts{font-size:1.2rem;letter-spacing:2px}
.arena small{color:#fff;font-weight:700}
/* results */
.res{text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.res.win{border-color:var(--gold);box-shadow:0 0 40px rgba(255,207,64,.4)}
.rstars{font-size:3.4rem;letter-spacing:8px;color:#4a5080;line-height:1}
.rstars .on{display:inline-block;color:var(--gold);text-shadow:0 0 20px var(--gold);animation:starin .6s both}
.rgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;width:100%}
.rgrid div{background:var(--card2);border-radius:16px;padding:10px 4px;box-shadow:inset 0 0 0 1.5px var(--line)}
.rgrid b{display:block;font-size:1.35rem}.rgrid small{color:var(--mut)}.rgrid .g{color:var(--ok)}.rgrid .r{color:var(--bad)}
.note{background:var(--card2);padding:8px 14px;border-radius:14px;font-weight:600}
.weak h4{margin-bottom:8px}
/* zone grids */
.zgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px;margin-top:14px}
.zc{text-align:left;padding:16px;border-radius:22px;background:var(--card);border:2px solid var(--line);display:flex;gap:12px;align-items:center;transition:transform .15s,box-shadow .15s;box-shadow:0 8px 22px rgba(0,0,30,.3)}
.zc:hover{transform:translateY(-4px) rotate(-.6deg);box-shadow:0 0 26px var(--glow),0 0 0 2px var(--cy)}
.zc>span{font-size:2.2rem}.zc b{display:block}.zc small{color:var(--mut)}
.zc.big{flex-direction:column;text-align:center;padding:24px}.zc.big>span{font-size:3.6rem}
/* flip cards */
.mem{display:grid;gap:10px;width:100%;max-width:640px;margin:0 auto}
.mc{aspect-ratio:3/4;perspective:700px}
.mc>div{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
.mc.up>div{transform:rotateY(180deg)}
.mc .f,.mc .b{position:absolute;inset:0;border-radius:16px;display:grid;place-items:center;backface-visibility:hidden;-webkit-backface-visibility:hidden;padding:4px;text-align:center;font-weight:700;font-size:clamp(.72rem,2.4vw,1rem)}
.mc .f{background:linear-gradient(160deg,#7c4dff,#3d7bff);box-shadow:inset 0 0 0 3px #fff3,0 4px 0 #2a2f9c;font-size:1.8rem}
.mc .b{background:#fff;color:#1b2255;transform:rotateY(180deg);box-shadow:inset 0 0 0 3px var(--cy)}
.mc.hit .b{background:#c9ffe0;box-shadow:inset 0 0 0 3px var(--ok),0 0 16px var(--ok);animation:pop .4s}
.mc .art{font-size:clamp(1.8rem,7vw,3rem);animation:none}
.flash{width:min(100%,340px);aspect-ratio:4/5;margin:0 auto;perspective:900px;cursor:pointer}
.flash>div{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.flash.up>div{transform:rotateY(180deg)}
.flash .f,.flash .b{position:absolute;inset:0;border-radius:26px;display:flex;flex-direction:column;gap:10px;align-items:center;justify-content:center;backface-visibility:hidden;-webkit-backface-visibility:hidden;padding:16px;text-align:center}
.flash .f{background:linear-gradient(160deg,#243a9c,#5b2be0);box-shadow:inset 0 0 0 3px var(--cy),0 0 26px var(--glow);color:#fff}
.flash .b{background:linear-gradient(160deg,#fff,#e3edff);color:#1b2255;transform:rotateY(180deg);box-shadow:inset 0 0 0 3px var(--gold)}
.flash h3{font-size:1.7rem}
/* dictionary */
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:14px}
.dc{background:var(--card2);border-radius:20px;padding:12px 8px;text-align:center;box-shadow:inset 0 0 0 1.5px var(--line);display:flex;flex-direction:column;gap:4px;align-items:center;transition:transform .15s}
.dc:hover{transform:translateY(-4px);box-shadow:inset 0 0 0 2px var(--cy),0 0 18px var(--glow)}
.dc small{color:var(--mut)}
/* match */
.match{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.mcol{display:flex;flex-direction:column;gap:10px}
.mi{padding:.6em;border-radius:16px;font-weight:700;background:var(--card2);box-shadow:inset 0 0 0 2px var(--line);min-height:56px}
.mi.sel{box-shadow:inset 0 0 0 3px var(--gold),0 0 16px var(--gold)}
.mi.done{background:linear-gradient(180deg,#5cf0a6,#1fae6a);color:#04321c;box-shadow:none;pointer-events:none}
/* crossword / wordsearch */
.cw{display:grid;gap:3px;justify-content:center;margin:0 auto}
.cc{position:relative;width:100%;aspect-ratio:1}
.cc input{width:100%;height:100%;border-radius:7px;border:2px solid #6a8fd6;background:#fff;color:#10143c;text-align:center;font-weight:700;font-size:clamp(.8rem,3vw,1.1rem);text-transform:uppercase;padding:0;outline:none}
.cc input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(255,207,64,.5)}
.cc input.ok{background:#c9ffe0}.cc input.bad{background:#ffd3db}
.cc sup{position:absolute;left:3px;top:1px;font-size:.6rem;font-weight:700;color:#3d5bff;z-index:1;pointer-events:none}
.clues{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px;text-align:left}
.clues h4{color:var(--ac)}.clues p{margin-top:4px}
.ws{display:grid;gap:3px;max-width:460px;margin:0 auto;user-select:none}
.ws button{aspect-ratio:1;border-radius:8px;background:var(--card2);box-shadow:inset 0 0 0 1.5px var(--line);font-weight:700;font-size:clamp(.85rem,3.4vw,1.2rem)}
.ws button.sel{background:var(--gold);color:#3b1c00}.ws button.fd{background:linear-gradient(180deg,#5cf0a6,#1fae6a);color:#04321c}
.wl{margin-top:12px}.wl .vchip.fd{text-decoration:line-through;opacity:.55}
/* race */
.lanes{border-radius:20px;overflow:hidden;border:2px solid var(--ac);background:linear-gradient(180deg,#14502a,#1c6a3a);margin-bottom:10px}
.lane{position:relative;height:50px;border-bottom:2px dashed #fff5}
.lane:last-child{border:0}.lane.me{background:rgba(255,255,255,.14)}
.lane::after{content:"🏁";position:absolute;right:6px;top:10px;font-size:1.4rem}
.rc{position:absolute;top:4px;left:2%;font-size:1.9rem;transition:left .7s cubic-bezier(.3,1.4,.5,1);display:flex;align-items:center;gap:4px}
.rc small{font-size:.7rem;font-weight:700;color:#fff;background:#0008;padding:1px 6px;border-radius:8px}
/* hunter */
.field{position:relative;height:min(50vh,400px);border-radius:22px;border:2px solid var(--ac);overflow:hidden;background:linear-gradient(180deg,#0b1242,#2a1b6e 60%,#143d6e)}
.fw{position:absolute;top:-14%;padding:.45em .9em;border-radius:14px;font-weight:700;color:#10143c;background:linear-gradient(180deg,#fff,#cfe6ff);box-shadow:0 4px 0 #6a8fd6,0 0 14px rgba(56,214,255,.5);animation:fall linear forwards;white-space:nowrap}
.fw.bad{background:#ff8fa3}.fw.ok{background:#7ee8a2}
.target{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:10px;min-height:76px}
/* bingo */
.bingo{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:440px;margin:0 auto}
.bc{position:relative;aspect-ratio:1;border-radius:18px;background:#fff;box-shadow:inset 0 0 0 3px #b8c8ff,0 4px 0 #6a8fd6;display:grid;place-items:center}
.bc .art{font-size:clamp(1.8rem,8vw,2.8rem);animation:none}
.bc.mk{background:#ffe9a3}.bc.mk::after{content:"⭐";position:absolute;font-size:clamp(2rem,9vw,3.2rem);opacity:.9;animation:pop .35s}
.bc.ln{box-shadow:inset 0 0 0 4px var(--ok),0 0 18px var(--ok)}
/* city */
.cityg{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;margin-top:14px}
.pl{padding:16px 8px;border-radius:22px;background:var(--card2);box-shadow:inset 0 0 0 2px var(--line);display:flex;flex-direction:column;align-items:center;gap:4px;transition:transform .15s}
.pl>span{font-size:3rem}.pl small{color:var(--mut)}
.pl.open{box-shadow:inset 0 0 0 3px var(--gold),0 0 20px rgba(255,207,64,.5);animation:pulse 1.8s infinite}
.pl.done{background:linear-gradient(180deg,rgba(53,224,138,.35),rgba(53,224,138,.12));box-shadow:inset 0 0 0 2px var(--ok)}
.pl.lock{opacity:.5;filter:grayscale(.7)}
.pl:hover:not(.lock){transform:translateY(-4px)}
/* shop & awards */
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;margin:12px 0 20px}
.si{background:var(--card2);border-radius:20px;padding:12px 8px;text-align:center;box-shadow:inset 0 0 0 1.5px var(--line);display:flex;flex-direction:column;gap:6px;align-items:center}
.si.eq{box-shadow:inset 0 0 0 3px var(--gold),0 0 16px rgba(255,207,64,.45)}
.si .big2{font-size:2.6rem;height:72px;display:grid;place-items:center}
.ach{display:flex;gap:10px;align-items:center;background:var(--card2);border-radius:18px;padding:10px 12px;box-shadow:inset 0 0 0 1.5px var(--line);text-align:left}
.ach>span{font-size:2rem}.ach.no{opacity:.45;filter:grayscale(1)}.ach small{color:var(--mut);display:block}
.medals{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:12px 0}
.medals div{text-align:center;background:var(--card2);border-radius:16px;padding:8px 2px;font-size:.75rem;font-weight:600}
.medals span{display:block;font-size:2rem}
.dip{width:100%;max-width:820px;border-radius:14px;box-shadow:0 0 40px rgba(255,207,64,.45);display:block;margin:0 auto 14px}
/* modal & toast */
#modal{position:fixed;inset:0;z-index:90;background:rgba(3,5,30,.72);display:grid;place-items:center;padding:16px;backdrop-filter:blur(4px)}
.mbox{max-width:560px;width:100%;max-height:86vh;overflow:auto;text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center;animation:pop .3s both}
.mbox ul{text-align:left;margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px}
#toast{position:fixed;left:50%;bottom:70px;transform:translateX(-50%);z-index:97;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:92%}
#toast div{background:#10143cf2;color:#fff;border:2px solid var(--cy);padding:10px 18px;border-radius:16px;font-weight:600;box-shadow:0 0 20px rgba(56,214,255,.5);animation:toast 3s forwards;text-align:center}
/* footer */
#foot{position:fixed;left:0;right:0;bottom:0;z-index:60;text-align:center;padding:7px 10px 9px;background:linear-gradient(180deg,transparent,rgba(4,6,32,.88) 45%);pointer-events:none}
[data-theme=day] #foot{background:linear-gradient(180deg,transparent,rgba(20,26,80,.82) 45%)}
#foot span{font-family:"Great Vibes","Brush Script MT","Segoe Script","Snell Roundhand","Lucida Handwriting",cursive;font-style:italic;font-size:clamp(1.25rem,4vw,1.65rem);letter-spacing:.03em;background:linear-gradient(90deg,#ffd76a,#7fdcff,#b58cff,#ffffff,#ffd76a,#7fdcff);background-size:400% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:slide 9s linear infinite;filter:drop-shadow(0 0 6px rgba(160,200,255,.55));padding:0 .3em}
.qcard>.match,.qcard>.ws,.qcard>.dgrid,.qcard>.cw,.qcard>.clues{width:100%}
.cw{width:100%}.ws{width:100%}
#printArea{display:none}
@media print{body>*:not(#printArea){display:none!important}body{background:#fff;padding:0}#printArea{display:block}#printArea img{width:100%}}
/* keyframes */
@keyframes slide{to{background-position:300% 0}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes float{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-8px) rotate(2deg)}}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
@keyframes wav{0%,100%{transform:rotate(-12deg)}50%{transform:rotate(22deg)}}
@keyframes jump{0%,100%{transform:translateY(0)}50%{transform:translateY(-18px)}}
@keyframes letter{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
@keyframes pop{0%{transform:scale(.8);opacity:0}70%{transform:scale(1.05)}100%{transform:scale(1);opacity:1}}
@keyframes rise{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
@keyframes dash{to{stroke-dashoffset:-18}}
@keyframes fly{to{transform:translate(-50%,-90px);opacity:0}}
@keyframes starin{0%{transform:scale(0) rotate(-180deg)}70%{transform:scale(1.4)}100%{transform:scale(1)}}
@keyframes toast{0%{transform:translateY(20px);opacity:0}10%,85%{transform:none;opacity:1}100%{opacity:0}}
@keyframes fall{to{top:104%}}
@keyframes batk{0%,100%{transform:translateX(0) scale(1)}40%{transform:translateX(-60px) scale(1.18) rotate(-8deg)}}
@keyframes bhit{0%,100%{transform:translateX(0);filter:none}25%{transform:translateX(12px) rotate(6deg);filter:brightness(2.2)}60%{transform:translateX(-8px)}}
@keyframes bko{0%{transform:rotate(0)}40%{transform:rotate(25deg) translateY(-20px)}100%{transform:rotate(90deg) translateY(30px);opacity:.55}}
@media(max-width:640px){.pics{grid-template-columns:1fr 1fr;max-width:340px}.rgrid{grid-template-columns:repeat(3,1fr)}.hud-me b{display:none}.node{width:96px}.nico{width:58px;height:58px;font-size:1.7rem}.card{padding:16px}.boss{width:110px}.clues{grid-template-columns:1fr}.medals{grid-template-columns:repeat(5,1fr)}.bubble{margin-bottom:50px;font-size:.92rem}.chip{font-size:.82rem;padding:.25em .6em}.ib{width:38px;height:38px}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-iteration-count:1!important}}
</style>

/* ================= SESSION ENGINE ================= */
const PRAISE=['Great job! 🎉','Excellent! ⭐','Awesome! 🚀','Well done! 👏','Perfect! 💎','You rock! 🎸','Super! 🌟'],OOPS=['Almost! 💪','Not yet — keep trying! 🌈','Good try! 🙂','Let’s learn it! 📘'];
function startSession(cfg){go(()=>{
 G={cfg,qs:cfg.qs.slice(),i:-1,ok:0,bad:0,streak:0,best:0,score:0,miss:{},total:cfg.qs.length,hearts:cfg.hearts||0,hp:cfg.bossHp||0,tok:0,timer:null};
 const run=cfg.boss?`<div class="arena"><div class="side">${mascot({cls:'mini'})}<span class="hearts" id="ghearts"></span><small>${esc(S.name||'You')}</small></div><div class="vs">VS</div><div class="side"><div class="boss" id="boss">${BOSS}</div><div class="hp"><i id="bhp"></i></div><small>Captain Fuzz</small></div></div>`
  :`<div class="track"><div class="dec">${(cfg.decor||['🌲','🍄','🌳','🦋','🌲']).map(d=>`<span>${d}</span>`).join('')}</div><div class="pth"></div><div class="fill" id="gfill"></div><span class="goal">🏁</span><div class="runner" id="grun">${mascot({cls:'mini'})}</div></div>`;
 view.innerHTML=`<section class="game sc-${cfg.scene||'forest'}"><div class="gbar"><button class="ib" id="gx" title="Exit">✖</button><b class="gt">${cfg.title}</b><span class="chip" id="gprog"></span><span class="chip">🏆 <b id="gscore">0</b></span><span class="chip" id="gstreak">🔥 0</span>${cfg.hearts&&!cfg.boss?'<span class="chip hearts" id="ghearts"></span>':''}</div>${run}<div class="tbar" id="tbar" hidden><i></i></div><div class="card qcard" id="qcard"></div><div class="fb" id="fb"></div></section>`;
 $('#gx').onclick=()=>confirmBox('¿Salir del reto?','Se perderá el avance de esta partida.',cfg.back||viewMap,'Salir');
 onLeave(()=>clearTimeout(G&&G.timer));nextQ()})}
function updBar(){if(!G)return;const c=G.cfg,q=G.q;$('#gprog').textContent=q&&q.second?'🔁 Repaso':`${Math.min(G.i+1,G.total)} / ${G.total}`;$('#gscore').textContent=G.score;$('#gstreak').textContent='🔥 '+G.streak;
 const h=$('#ghearts');if(h)h.textContent='❤️'.repeat(Math.max(0,G.hearts))+'🖤'.repeat(Math.max(0,c.hearts-G.hearts));
 if(c.boss)$('#bhp').style.width=G.hp/c.bossHp*100+'%';else{const p=3+G.ok/G.total*90;$('#grun').style.left=p+'%';$('#gfill').style.width=(p-3)+'%'}}
function bossAnim(k,ms=700){const b=$('#boss');if(!b)return;b.classList.remove('atk','hit','def');void b.offsetWidth;b.classList.add(k);if(k!=='ko')setTimeout(()=>b.classList.remove(k),ms)}
function stopTimer(){if(G){clearTimeout(G.timer);G.timer=null}const t=$('#tbar');if(t)t.hidden=true}
function nextQ(){if(!G)return;G.i++;G.tok++;const c=G.cfg;
 if((c.hearts&&G.hearts<=0)||(c.boss&&G.hp<=0)||G.i>=G.qs.length)return endSession();
 const q=G.q=G.qs[G.i];q.hint=0;q.done=false;$('#fb').innerHTML='';updBar();
 const card=$('#qcard');card.classList.remove('pop');void card.offsetWidth;card.classList.add('pop');card.innerHTML=q.second?'<div class="tag2">🔁 Second chance</div>':'';
 T[q.type](q,card,(ok,o)=>finish(q,ok,o));
 if(c.boss)bossAnim('def',900);
 if(q.say)Speech.say(q.say);
 if(q.time){const tb=$('#tbar'),i=tb.firstElementChild;tb.hidden=false;i.style.transition='none';i.style.transform='scaleX(1)';void i.offsetWidth;i.style.transition=`transform ${q.time}s linear`;i.style.transform='scaleX(0)';
  G.timer=setTimeout(()=>{$$('#qcard button:not([data-say])').forEach(b=>b.disabled=true);finish(q,false,{timeout:true})},q.time*1000)}}
function finish(q,ok,o={}){if(!G||q.done)return;q.done=true;stopTimer();const tok=G.tok,c=G.cfg;
 if(!q.second){ok?G.ok++:G.bad++}
 if(ok){G.streak++;G.best=Math.max(G.best,G.streak);const pts=q.second?50:Math.max(20,100+Math.min(G.streak-1,5)*20-(q.hint||0)*25);G.score+=pts;sfx('ok');floatPts('+'+pts);
  if(c.boss){G.hp--;bossAnim('hit');sfx('hit')}
  if(c.review&&q.vid&&S.mist[q.vid]){S.mist[q.vid]--;if(S.mist[q.vid]<=0)delete S.mist[q.vid];save()}
  if(G.streak===5)award('streak5');if(G.streak===10)award('streak10')}
 else{G.streak=0;sfx(o.soft?'flip':'bad');if(q.vid){S.mist[q.vid]=(S.mist[q.vid]||0)+1;G.miss[q.vid]=1;save()}
  if(c.hearts)G.hearts--;if(c.boss)bossAnim('atk');
  if(!q.second&&!q.noRetry&&!c.noRetry)G.qs.push({...q,second:true})}
 updBar();
 const head=ok?pick(PRAISE):o.timeout?'⏰ Time’s up!':o.soft?'Now you found it! 👍':pick(OOPS);
 $('#fb').innerHTML=`<div class="fbox ${ok?'good':'oops'}"><div><b>${head}</b>${!ok&&q.explain?`<p>${q.explain}</p>`:''}${q.sayAns?`<p>✅ ${colorSen(q.sayAns)} <button class="spk" data-say="${esc(q.sayAns)}">🔊</button></p>`:''}${!ok&&!q.second&&!q.noRetry&&!c.noRetry?'<p><small>🔁 Tendrás una segunda oportunidad al final.</small></p>':''}</div><button class="btn sm" id="nx">NEXT ➜</button></div>`;
 $('#nx').onclick=()=>{if(G&&G.tok===tok)nextQ()};try{$('#fb').scrollIntoView({block:'nearest',behavior:'smooth'})}catch(e){}

 if(ok)Promise.all([sp,sleep(1200)]).then(()=>{if(G&&G.tok===tok&&G.q===q)nextQ()})}
async function endSession(){const g=G,c=g.cfg;stopTimer();g.tok++;
 const seen=g.ok+g.bad||1;let pct,pass;
 if(c.boss){pass=g.hp<=0;pct=Math.round(g.ok/seen*100);if(pass){bossAnim('ko');sfx('win');FX.confetti(200);await sleep(1500)}else{sfx('lose');await sleep(600)}}
 else if(c.hearts&&g.hearts<=0){pass=false;pct=Math.round(g.ok/g.total*100)}
 else{pct=Math.round(g.ok/g.total*100);pass=pct>=70}
 if(G!==g)return;
 const r={cfg:c,ok:g.ok,bad:g.bad,pct,pass,stars:!pass?0:pct>=95?3:pct>=82?2:1,score:g.score,miss:Object.keys(g.miss),streak:g.best};
 if(c.onEnd)return c.onEnd(r);finalize(r)}
const DIPL={1:'Vocabulary Explorer',2:'Listening Star',5:'Grammar Hero',8:'Sentence Master',10:'English Champion'};
function finalize(r){const c=r.cfg,n=c.level;let bonus=0;if(r.pass&&!c.practice)bonus+=300;if(r.pass&&r.bad===0&&r.ok>0)bonus+=c.practice?50:200;r.bonus=bonus;r.score+=bonus;
 r.coins=r.ok*(c.practice?2:5)+r.stars*(c.practice?5:20);S.score+=r.score;S.coins+=r.coins;
 if(n){S.stars[n]=Math.max(S.stars[n]||0,r.stars);S.best[n]=Math.max(S.best[n]||0,r.score);
  if(r.pass){if(S.unlocked<n+1&&n<10){S.unlocked=n+1;r.unlocked=n+1}if(DIPL[n]&&!S.dipl[n]){S.dipl[n]=today();r.dip=n}award('first');if(n>=5)award('half');if(n===10)award('champ')}}
 if(r.pass&&r.bad===0&&r.ok>=5)award('perfect');if(S.score>=5000)award('k5');if(S.coins>=500)award('rich');
 save();viewResults(r)}
function viewResults(r){go(()=>{const c=r.cfg,n=c.level,vs=r.miss.map(id=>VM[id]).filter(Boolean);
 view.innerHTML=`<section class="resv"><div class="card res ${r.pass?'win':''}">${mascot({cls:r.pass?'jump':'sad'})}
 <h2 class="title sm">${r.head||c.head||(r.pass?(r.stars===3?'PERFECT! 🌟':c.practice?'WELL DONE! 🎉':'LEVEL COMPLETE! 🎉'):'KEEP TRYING! 💪')}</h2>
 <p><b>${esc(S.name||'Player')}</b> · ${c.title}</p>
 <div class="rstars">${[1,2,3].map(i=>`<span class="${i<=r.stars?'on':''}" style="animation-delay:${i*.25}s">★</span>`).join('')}</div>

  b.innerHTML=`<p class="qsub">Round ${round+1} / 3 · Une cada palabra con su ${img?'dibujo':'traducción'}</p><div class="match"><div class="mcol">${vs.map(v=>`<button class="mi" data-l="${v.id}">${v.en}</button>`).join('')}</div><div class="mcol">${shuffle(vs).map(v=>`<button class="mi" data-r="${v.id}">${img?`<span class="art xs">${v.art}</span>`:v.es}</button>`).join('')}</div></div>`;
  $$('[data-l]',b).forEach(e=>e.onclick=()=>{$$('.sel',b).forEach(x=>x.classList.remove('sel'));e.classList.add('sel');sel=e;Speech.say(VM[e.dataset.l].en)});
  $$('[data-r]',b).forEach(e=>e.onclick=()=>{if(!sel)return toast('👈 Primero elige una palabra en inglés');
   if(sel.dataset.l===e.dataset.r){sel.classList.remove('sel');sel.classList.add('done');e.classList.add('done');sel=null;sfx('ok');
    if(!--left){round++;if(round>=3){reward(20,200,'🔗 Matching complete!');b.innerHTML=`<span class="art sm">🎉</span><h3>Great matching!</h3><p>Errores: ${err}</p><div class="wrapc"><button class="btn" id="mg">🔁 Play again</button><button class="btn ghost" id="mb">⬅ Practice Zone</button></div>`;$('#mg').onclick=viewMatch;$('#mb').onclick=viewPractice}else setTimeout(next,700)}}
   else{err++;sfx('bad');e.classList.add('shake');setTimeout(()=>e.classList.remove('shake'),400);S.mist[sel.dataset.l]=(S.mist[sel.dataset.l]||0)+1;save()}})};next()})}
const CW=[...V.filter(v=>!v.rest).map(v=>({w:v.verb.toUpperCase(),q:`${v.art} ${v.es}`})),...[['SOCCER','⚽ Playing ______'],['BASKETBALL','🏀 Playing ______'],['BIKE','🚲 Riding a ______'],['HORSE','🏇 Riding a ______'],['MUSIC','🎧 Listening to ______'],['WATER','🥤 Drinking ______'],['PHOTOS','📷 Taking ______'],['CINEMA','🎬 Going to the ______'],['ROPE','Jumping ______ (soga)'],['TAG','👉🏃 Playing ______'],['JUMPING','______ rope (saltar)'],['WATCHING','📺 ______ TV (ver)'],['RIDING','🏇 ______ a horse (montar)'],['DRINKING','🥤 ______ water (beber)'],['SHOPPING','🛍️ Going ______'],['CYCLING','🚴 Going ______']].map(([w,q])=>({w,q}))];
function makeCross(list){const N=19,g=Array.from({length:N},()=>Array(N).fill('')),gd=Array.from({length:N},()=>Array(N).fill(-1)),out=[];
 const at=(y,x)=>y<0||x<0||y>=N||x>=N?'':g[y][x];
 const fit=(w,r,c,d)=>{const dr=d,dc=1-d,L=w.length;if(r+dr*(L-1)>=N||c+dc*(L-1)>=N)return 0;if(at(r-dr,c-dc)||at(r+dr*L,c+dc*L))return 0;let n=0;
  for(let k=0;k<L;k++){const y=r+dr*k,x=c+dc*k,ch=g[y][x];if(ch){if(ch!==w[k]||gd[y][x]===d||gd[y][x]===2)return 0;n++}else if(at(y+dc,x+dr)||at(y-dc,x-dr))return 0}return n};
 const put=(o,r,c,d)=>{[...o.w].forEach((ch,k)=>{const y=r+d*k,x=c+(1-d)*k;gd[y][x]=g[y][x]?2:d;g[y][x]=ch});out.push({...o,r,c,d})};
 list.forEach((o,i)=>{if(!i)return put(o,9,Math.floor((N-o.w.length)/2),0);const ops=[];for(let r=0;r<N;r++)for(let c=0;c<N;c++)for(const d of[0,1])if(fit(o.w,r,c,d))ops.push([r,c,d]);if(ops.length)put(o,...pick(ops))});return out}
function viewCross(){go(()=>{let pl=[];for(let t=0;t<40;t++){const r=makeCross(sample(CW,9));if(r.length>pl.length)pl=r;if(pl.length>=7)break}
 const mr=Math.min(...pl.map(p=>p.r)),mc=Math.min(...pl.map(p=>p.c));let R=0,C=0;const cells={},starts={};let num=0,dir=0,won=false;
 pl.forEach(p=>{p.r-=mr;p.c-=mc;R=Math.max(R,p.r+(p.d?p.w.length-1:0));C=Math.max(C,p.c+(p.d?0:p.w.length-1))});
 pl.sort((a,b)=>a.r-b.r||a.c-b.c).forEach(p=>{const k=p.r+','+p.c;if(!starts[k])starts[k]=++num;p.num=starts[k];[...p.w].forEach((ch,i)=>{const kk=(p.r+(p.d?i:0))+','+(p.c+(p.d?0:i));cells[kk]=cells[kk]||{ch,a:0,d:0};cells[kk][p.d?'d':'a']=1})});
 let h='';for(let y=0;y<=R;y++)for(let x=0;x<=C;x++){const k=y+','+x;h+=cells[k]?`<div class="cc">${starts[k]?`<sup>${starts[k]}</sup>`:''}<input data-y="${y}" data-x="${x}" inputmode="text" autocomplete="off" autocapitalize="characters" aria-label="row ${y+1} column ${x+1}"></div>`:'<div></div>'}
 const cl=d=>pl.filter(p=>p.d===d).map(p=>`<p><b>${p.num}.</b> ${p.q} <small>(${p.w.length})</small></p>`).join('');
 const b=shell('🧩 Crossword',viewPractice,`<div class="cw" style="grid-template-columns:repeat(${C+1},minmax(0,1fr));max-width:${(C+1)*40}px">${h}</div><div class="wrapc"><button class="btn ghost sm" id="ch">💡 Reveal a letter</button><button class="btn ghost sm" id="cn2">🔄 New</button><button class="btn sm" id="ck">CHECK ✔</button></div><div class="clues"><div><h4>➡ Across</h4>${cl(0)}</div><div><h4>⬇ Down</h4>${cl(1)}</div></div>`,'tower');
 const inp=(y,x)=>$(`.cc input[data-y="${y}"][data-x="${x}"]`,b),all=$$('.cc input',b);
 all.forEach(el=>{const y=+el.dataset.y,x=+el.dataset.x,c=cells[y+','+x];
  el.onfocus=()=>{if(c.a&&!c.d)dir=0;else if(c.d&&!c.a)dir=1;el.select()};
  el.oninput=()=>{el.value=el.value.replace(/[^a-zA-Z]/g,'').slice(-1).toUpperCase();el.classList.remove('ok','bad');if(el.value){const n=inp(y+dir,x+1-dir);n&&n.focus()}};
  el.onkeydown=e=>{if(e.key==='Backspace'&&!el.value){const p=inp(y-dir,x-(1-dir));if(p){p.value='';p.focus();e.preventDefault()}}}});
 const chOf=el=>cells[el.dataset.y+','+el.dataset.x].ch;
 $('#ck').onclick=()=>{let okAll=true;all.forEach(el=>{const good=el.value===chOf(el);el.classList.toggle('ok',good);el.classList.toggle('bad',!good&&!!el.value);if(!good)okAll=false});if(okAll&&!won){won=true;reward(30,300,'🧩 Crossword complete!')}else if(!okAll){sfx('flip');toast('✏️ Revisa las casillas rojas o vacías')}};
 $('#ch').onclick=()=>{const el=all.find(e=>e.value!==chOf(e));if(el){el.value=chOf(el);el.classList.remove('bad');el.classList.add('ok')}};$('#cn2').onclick=viewCross})}
function makeWS(words,N){const g=Array.from({length:N},()=>Array(N).fill('')),ok=[];
 words.forEach(w=>{for(let t=0;t<120;t++){const[dr,dc]=pick([[0,1],[1,0],[1,1]]),r=rnd(N-dr*(w.length-1)),c=rnd(N-dc*(w.length-1));let f=1;for(let k=0;k<w.length;k++){const ch=g[r+dr*k][c+dc*k];if(ch&&ch!==w[k]){f=0;break}}if(f){for(let k=0;k<w.length;k++)g[r+dr*k][c+dc*k]=w[k];ok.push(w);break}}});
 for(let y=0;y<N;y++)for(let x=0;x<N;x++)if(!g[y][x])g[y][x]=pick([...'ABCDEFGHIKLMNOPRSTUW']);return{g,words:ok}}
function viewSearch(){go(()=>{const N=10,{g,words}=makeWS(sample(CW,7).map(o=>o.w),N);let a=null,left=words.slice();
 const b=shell('🔎 Word Search',viewPractice,`<p class="qsub">Toca la <b>primera</b> y la <b>última</b> letra de cada palabra (→ ↓ ↘)</p><div class="ws" style="grid-template-columns:repeat(${N},1fr)">${g.map((r,y)=>r.map((ch,x)=>`<button data-y="${y}" data-x="${x}">${ch}</button>`).join('')).join('')}</div><div class="wl wrapc">${words.map(w=>`<span class="vchip" data-w="${w}">${w}</span>`).join('')}</div><div class="row"><button class="btn ghost sm" id="wn">🔄 New puzzle</button></div>`,'lab');
 const cell=(y,x)=>$(`.ws button[data-y="${y}"][data-x="${x}"]`,b);$('#wn').onclick=viewSearch;
 $$('.ws button',b).forEach(el=>el.onclick=()=>{const y=+el.dataset.y,x=+el.dataset.x;if(!a){a=[y,x];el.classList.add('sel');return}
  const s=a,dy=y-s[0],dx=x-s[1],L=Math.max(Math.abs(dy),Math.abs(dx));a=null;$$('.ws .sel',b).forEach(e=>e.classList.remove('sel'));
  if(!L||!(dy===0||dx===0||Math.abs(dy)===Math.abs(dx)))return sfx('flip');
  const cs=[];let str='';for(let k=0;k<=L;k++){const e=cell(s[0]+Math.sign(dy)*k,s[1]+Math.sign(dx)*k);cs.push(e);str+=e.textContent}
  const rev=[...str].reverse().join(''),w=left.includes(str)?str:left.includes(rev)?rev:null;if(!w)return sfx('bad');
  left=left.filter(z=>z!==w);cs.forEach(e=>e.classList.add('fd'));$(`[data-w="${w}"]`,b).classList.add('fd');sfx('ok');Speech.say(w.toLowerCase());if(!left.length)reward(25,250,'🔎 Word Search complete!')})})}

function drawDiploma(n){const W=1600,H=1130,c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d'),fin=n===10,name=S.name||'Student',CUR='"Great Vibes","Brush Script MT","Segoe Script","Snell Roundhand","Lucida Handwriting",cursive',SER='Georgia,"Times New Roman",serif';
 let g=x.createLinearGradient(0,0,W,H);g.addColorStop(0,'#0a0f3c');g.addColorStop(.5,'#2a1670');g.addColorStop(1,'#0a3a7a');x.fillStyle=g;x.fillRect(0,0,W,H);
 for(let i=0;i<170;i++){x.globalAlpha=Math.random()*.7+.1;x.fillStyle=pick(['#fff','#9fe3ff','#ffe9a3']);x.beginPath();x.arc(Math.random()*W,Math.random()*H,Math.random()*2.2+.4,0,7);x.fill()}x.globalAlpha=1;
 const gold=x.createLinearGradient(0,0,W,0);[[0,'#b8860b'],[.25,'#ffe58a'],[.5,'#fff6cf'],[.75,'#ffd24a'],[1,'#b8860b']].forEach(s=>gold.addColorStop(...s));
 x.strokeStyle=gold;x.lineWidth=14;x.strokeRect(34,34,W-68,H-68);x.lineWidth=3;x.strokeRect(62,62,W-124,H-124);
 x.textAlign='center';x.textBaseline='alphabetic';x.fillStyle=gold;x.font='64px serif';[[110,130],[W-110,130],[110,H-88],[W-110,H-88]].forEach(p=>x.fillText('★',p[0],p[1]));
 x.font=`700 76px ${SER}`;x.fillText('CERTIFICATE OF ACHIEVEMENT',W/2,215);
 x.fillStyle='#cfe3ff';x.font=`italic 38px ${SER}`;x.fillText('This certificate is proudly presented to:',W/2,300);
 let fs=140;const setF=()=>x.font=`italic ${fs}px ${CUR}`;setF();while(x.measureText(name).width>W-380&&fs>60){fs-=6;setF()}
 const ng=x.createLinearGradient(W/2-400,0,W/2+400,0);ng.addColorStop(0,'#7fdcff');ng.addColorStop(.5,'#fff');ng.addColorStop(1,'#c9a8ff');x.shadowColor='rgba(127,220,255,.8)';x.shadowBlur=24;x.fillStyle=ng;x.fillText(name,W/2,455);x.shadowBlur=0;
 x.fillStyle=gold;x.fillRect(W/2-380,490,760,4);
 x.fillStyle='#e8f0ff';x.font=`40px ${SER}`;
 if(fin){x.fillText('For successfully completing',W/2,575);x.fillStyle=gold;x.font=`700 56px ${SER}`;x.fillText('English Adventure: The World of Hobbies',W/2,655)}
 else{x.fillText('For earning the title of',W/2,570);x.fillStyle=gold;x.font=`700 68px ${SER}`;x.fillText(DIPL[n],W/2,655);x.fillStyle='#e8f0ff';x.font=`italic 34px ${SER}`;x.fillText('in English Adventure: The World of Hobbies',W/2,715)}
 x.font='110px serif';x.fillText(fin?'🏆':'🏅',W/2,850);
 const col=(cx,lab,val)=>{x.fillStyle='#fff';x.font=`700 38px ${SER}`;x.fillText(val,cx,965);x.fillStyle=gold;x.fillRect(cx-170,982,340,3);x.fillStyle='#cfe3ff';x.font=`28px ${SER}`;x.fillText(lab,cx,1022)};
 col(330,'Date',S.dipl[n]||today());col(W/2,fin?'Final score · Stars':'Score · Stars',fin?`${S.score} pts · ★ ${totalStars()} / 30`:`${S.best[n]||0} pts · ${'★'.repeat(S.stars[n]||0)||'—'}`);
 x.fillStyle='#fff';x.font=`italic 54px ${CUR}`;x.fillText('Prof. Jhon Dewis',W-330,962);x.fillStyle=gold;x.fillRect(W-500,982,340,3);x.fillStyle='#cfe3ff';x.font=`28px ${SER}`;x.fillText('Teacher',W-330,1022);return c}
function viewDiploma(n){go(()=>{let url='';try{url=drawDiploma(n).toDataURL('image/png')}catch(e){}let framed=false;try{framed=window.self!==window.top}catch(e){framed=true}
